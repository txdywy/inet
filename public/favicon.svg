<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Main Circle Background -->
  <circle cx="16" cy="16" r="14" fill="#0f172a" stroke="url(#grad1)" stroke-width="1.5" />
  
  <!-- Radar Sweeps -->
  <circle cx="16" cy="16" r="8" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.5" />
  <circle cx="16" cy="16" r="4" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-dasharray="1,1" opacity="0.3" />
  
  <!-- Scanning Line -->
  <line x1="16" y1="16" x2="26" y2="8" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 16 16" to="360 16 16" dur="3s" repeatCount="indefinite" />
  </line>
  
  <!-- Signal/Network Nodes -->
  <circle cx="22" cy="12" r="1.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="10" cy="20" r="1.2" fill="#3b82f6">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="18" cy="24" r="1" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>