<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxyPulse</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path in sessionStorage
    var path = window.location.pathname;
    var base = "/";
    if (path.startsWith(base)) {
      var sub = path.slice(base.length);
      if (sub && sub !== "index.html") {
        sessionStorage.setItem("spa-redirect", sub + window.location.search);
      }
    }
    window.location.replace(base);
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
